# Render 자동 배포 (main 푸시·수동 실행)
#
# 방법 A — GitHub Actions만으로 확실히 트리거하려면:
#   Render 대시보드 → 해당 Web Service → Settings → Deploy Hook → URL 생성
#   GitHub 저장소 → Settings → Secrets and variables → Actions
#   → New repository secret: 이름 RENDER_DEPLOY_HOOK_URL, 값에 Hook URL 붙여넣기
#   이후 main에 푸시할 때마다 이 워크플로가 Hook POST로 배포를 시작합니다.
#
# 방법 B — Render만 사용:
#   Render 서비스에서 GitHub 저장소·main 브랜치 연결 후 Auto-Deploy 활성화.
#   이 경우 Hook 시크릿 없어도 Render가 커밋을 받아 배포합니다.
#   (A와 B를 동시에 쓰면 같은 커밋에 배포가 두 번 돌 수 있으니 보통 한 가지만 씁니다.)
#
name: Deploy to Render

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-render-${{ github.ref }}
  cancel-in-progress: true

jobs:
  trigger-deploy-hook:
    runs-on: ubuntu-latest
    steps:
      - name: POST Render deploy hook
        env:
          HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          set -euo pipefail
          if [ -z "${HOOK:-}" ]; then
            echo "RENDER_DEPLOY_HOOK_URL 미설정 — Render Git Auto-Deploy만 쓰는 경우 정상입니다."
            echo "Actions에서 배포까지 확실히 연결하려면 저장소 Secret에 Deploy Hook URL을 추가하세요."
            exit 0
          fi
          echo "Deploy hook 호출 중..."
          curl -fsS -X POST "$HOOK" -w "\nHTTP %{http_code}\n"
          echo "Deploy hook 요청 완료."
