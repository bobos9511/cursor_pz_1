<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>게시판 페이지 - IBK KNOCK</title>
  <link rel="stylesheet" href="/assets/site.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">IBK KN<span class="brand-point">O</span>CK</div>
    <nav class="nav-links">
      <a href="/login.html">로그인</a>
      <a href="/dashboard.html">대시보드</a>
      <a class="active" href="/board.html">게시판</a>
      <a href="/ai-search.html">AI 검색</a>
    </nav>
  </header>

  <main class="container">
    <section class="card">
      <h1 class="title">게시판</h1>
      <p class="desc">IT/규정/개선 게시물 등록 및 AI 답변 상태를 확인합니다.</p>
      <p id="whoami" class="muted mt"></p>
      <form id="postForm" class="mt">
        <div class="row">
          <select id="type" class="select" style="max-width:170px;">
            <option value="IT">IT/오류</option>
            <option value="BIZ">규정/상품</option>
            <option value="SYS">개선제안</option>
          </select>
          <input id="title" class="input" placeholder="제목" required>
        </div>
        <div class="row mt">
          <textarea id="content" class="textarea" placeholder="문의 내용을 입력하세요." required></textarea>
        </div>
        <div class="row mt">
          <label><input id="withAi" type="checkbox" checked> AI 답변 자동 생성</label>
          <button type="submit" class="btn primary">등록</button>
          <button id="refreshBtn" type="button" class="btn">새로고침</button>
        </div>
      </form>
    </section>

    <section class="card mt">
      <div class="row" style="justify-content:space-between;">
        <h2 style="margin:0; font-size:18px;">게시물 목록</h2>
        <select id="filterType" class="select" style="max-width:160px;">
          <option value="ALL">전체</option>
          <option value="IT">IT/오류</option>
          <option value="BIZ">규정/상품</option>
          <option value="SYS">개선제안</option>
        </select>
      </div>
      <div class="mt">
        <table class="table">
          <thead>
            <tr>
              <th>#</th><th>유형</th><th>제목</th><th>작성자</th><th>시각</th><th>AI상태</th><th>AI 요약</th><th></th>
            </tr>
          </thead>
          <tbody id="postTbody"></tbody>
        </table>
      </div>
    </section>
  </main>

  <script src="/assets/common.js"></script>
  <script src="/assets/board.js"></script>
</body>
</html>
