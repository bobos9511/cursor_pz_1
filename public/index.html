  <script>
    (function () {
      try {
        var mode = localStorage.getItem("knock-theme-mode") || "system";
        var resolved = mode === "dark" ? "dark" : mode === "light" ? "light" : (window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
        document.documentElement.setAttribute("data-theme", resolved);
        var applyBodyTheme = function () {
          if (!document.body) return false;
          document.body.setAttribute("data-theme", resolved);
          return true;
        };
        if (!applyBodyTheme()) {
          var obs = new MutationObserver(function () {
            if (applyBodyTheme()) obs.disconnect();
          });
          obs.observe(document.documentElement, { childList: true, subtree: true });
        }
      } catch (_) {}
    })();
  </script>
