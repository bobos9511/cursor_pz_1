    <!-- 통합검색 모달 -->

                </form>
            </div>
            <div class="integrated-search-controls">
                <div class="integrated-search-chips">
                    <button type="button" class="btn btn-outline integrated-search-chip" onclick="applyIntegratedRelatedKeyword(this.innerText)">AI답변</button>
                    <button type="button" class="btn btn-outline integrated-search-chip" onclick="applyIntegratedRelatedKeyword(this.innerText)">오류코드</button>
                    <button type="button" class="btn btn-outline integrated-search-chip" onclick="applyIntegratedRelatedKeyword(this.innerText)">규정문의</button>

            </div>

            </div>
