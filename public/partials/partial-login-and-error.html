    <!-- ==========================================
         [로그인 페이지]
         ========================================== -->
    <div id="loginPage">
        <div class="login-bg"></div>
        <div class="login-box">
            <div class="text-center mb-20">
                <div class="font-bold login-brand-title">IBK KN<span class="login-brand-point">O</span>CK</div>
                <p class="login-brand-subtitle">IBK 스마트 업무지식센터</p>
            </div>
            <form onsubmit="event.preventDefault(); doLogin();" class="flex-col gap-20">
                <div>
                    <label class="font-bold" style="display: block; margin-bottom: 8px; color:#666;">직원번호</label>
                    <div class="relative flex items-center">
                        <svg class="icon absolute" style="left: 12px; color: #999;"><use href="#icon-user"></use></svg>
                        <input type="text" id="loginEmpNo" class="input" style="padding-left: 36px; padding-top: 12px; padding-bottom: 12px;" placeholder="직원번호 6자리 입력" value="123456" maxlength="6" inputmode="numeric" oninput="formatEmployeeNoInput()" onblur="padEmployeeNo()">
                    </div>
                </div>

                <div>
                    <label class="font-bold" style="display: block; margin-bottom: 8px; color:#666;">인증 수단</label>
                    <div class="flex gap-10">
                        <label class="flex-1 relative">
                            <input type="radio" name="auth" value="pwd" class="auth-radio" checked onchange="changeAuthType('pwd')">
                            <span class="auth-label">비밀번호</span>
                        </label>
                        <label class="flex-1 relative">
                            <input type="radio" name="auth" value="motp" class="auth-radio" onchange="changeAuthType('motp')">
                            <span class="auth-label">MOTP</span>
                        </label>
                        <label class="flex-1 relative">
                            <input type="radio" name="auth" value="vein" class="auth-radio" onchange="changeAuthType('vein')">
                            <span class="auth-label">지정맥</span>
                        </label>
                    </div>
                </div>

                <div>
                    <div class="relative flex items-center">
                        <svg class="icon absolute" id="authIcon" style="left: 12px; color: #999;"><use href="#icon-lock"></use></svg>
                        <input type="password" id="authInput" class="input" style="padding-left: 36px; padding-top: 12px; padding-bottom: 12px;" placeholder="비밀번호 입력">
                    </div>
                </div>

                <div class="mt-20">
                    <button type="submit" class="btn btn-primary w-full" style="padding: 14px; font-size: 15px;">로그인</button>
                </div>
                
                <div class="flex items-center" style="margin: 5px 0;">
                    <div class="flex-1" style="border-top: 1px solid #eee;"></div>
                    <span style="padding: 0 15px; color: #999; font-size: 12px;">또는</span>
                    <div class="flex-1" style="border-top: 1px solid #eee;"></div>
                </div>

                <button type="button" id="loginSsoBtn" onclick="doLogin()" class="btn w-full" style="border: 2px solid var(--ibk-blue); color: var(--ibk-blue); background: #fff; padding: 14px; font-size: 15px;">통합인증 (SSO) 자동 로그인</button>
                <button type="button" class="login-test-access-btn" onclick="openLoginTestToolsModal()" aria-label="테스트용 계정 접속">
                    <span class="login-test-access-badge" aria-hidden="true">TEST</span>
                    <span class="login-test-access-caption">테스트용 접속 계정</span>
                </button>
            </form>
        </div>
        <button type="button" id="loginThemeFab" class="login-theme-fab" onclick="toggleLoginThemeMode()" aria-label="로그인 테마 전환">
            <span id="loginThemeFabIcon" aria-hidden="true">☾</span>
        </button>
    </div>
    <div id="serverErrorPage" class="server-error-page hidden" aria-live="polite">
        <div class="server-error-bg-decor" aria-hidden="true">
            <span class="server-error-orb server-error-orb--a"></span>
            <span class="server-error-orb server-error-orb--b"></span>
            <span class="server-error-grid"></span>
        </div>
        <div class="server-error-inner">
            <div class="server-error-hero" aria-hidden="true">
                <svg class="server-error-hero-svg" viewBox="0 0 200 120" xmlns="http://www.w3.org/2000/svg">
                    <defs>
                        <linearGradient id="seGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                            <stop offset="0%" style="stop-color:#38bdf8"/>
                            <stop offset="100%" style="stop-color:#2563eb"/>
                        </linearGradient>
                    </defs>
                    <ellipse cx="100" cy="108" rx="72" ry="8" fill="rgba(56,189,248,0.15)"/>
                    <path d="M52 78 L100 38 L148 78 Z" fill="none" stroke="url(#seGrad)" stroke-width="3" stroke-linejoin="round"/>
                    <circle cx="100" cy="62" r="8" fill="url(#seGrad)"/>
                    <path d="M100 46 L100 28" stroke="#64748b" stroke-width="2" stroke-linecap="round"/>
                    <circle cx="100" cy="22" r="4" fill="#94a3b8"/>
                    <path class="server-error-pulse" d="M130 22 Q155 22 170 40" fill="none" stroke="#f97316" stroke-width="2" stroke-dasharray="4 6" opacity="0.85"/>
                    <path class="server-error-pulse server-error-pulse--delay" d="M70 22 Q45 22 30 40" fill="none" stroke="#f97316" stroke-width="2" stroke-dasharray="4 6" opacity="0.85"/>
                </svg>
                <p class="server-error-hero-tag">연결 복구 중</p>
            </div>
            <div class="server-error-card">
                <div class="server-error-title">서버 연결 오류</div>
                <div id="serverErrorMessage" class="server-error-message">일시적인 서버 오류가 발생했습니다.</div>
                <div id="serverErrorStatus" class="server-error-status">오류 코드: -</div>
                <div class="server-error-actions">
                    <button type="button" class="btn btn-primary server-error-retry-btn" onclick="retryServerRecovery()">지금 다시 확인</button>
                </div>
                <div class="server-error-game-panel">
                    <div class="server-error-game-head">
                        <span class="server-error-game-label">기다리는 동안 · <span class="server-error-game-title-accent">KNOCK 런웨이</span></span>
                        <span id="serverErrorGameScore" class="server-error-game-score" aria-live="polite">0</span>
                    </div>
                    <div class="server-error-canvas-wrap">
                        <canvas id="serverErrorGameCanvas" width="400" height="224" role="img" aria-label="미니 런 게임: 스페이스바 또는 화면을 눌러 점프"></canvas>
                    </div>
                    <p class="server-error-game-hint"><kbd>스페이스</kbd> 또는 탭으로 점프 · 코인과 배율을 모아 보세요</p>
                </div>
                <div class="server-error-hint">서버 상태를 주기적으로 확인 중이며, 정상화되면 자동 새로고침됩니다.</div>
            </div>
        </div>
    </div>
