<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>로그인 페이지 - IBK KNOCK</title>
  <link rel="stylesheet" href="/assets/site.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">IBK KN<span class="brand-point">O</span>CK</div>
    <nav class="nav-links">
      <a class="active" href="/login.html">로그인</a>
      <a href="/dashboard.html">대시보드</a>
      <a href="/board.html">게시판</a>
      <a href="/ai-search.html">AI 검색</a>
    </nav>
  </header>

  <main class="container">
    <section class="card">
      <h1 class="title">로그인</h1>
      <p class="desc">직원번호 기반으로 로그인하고 세션을 유지합니다.</p>
      <p id="currentSession" class="muted mt">현재 로그인: 없음</p>
      <form id="loginForm" class="mt">
        <div class="row">
          <input id="employeeNo" class="input" placeholder="직원번호(예: 100001)" required>
          <input id="name" class="input" placeholder="이름" required>
        </div>
        <div class="row mt">
          <input id="deptName" class="input" placeholder="부서명">
          <select id="role" class="select">
            <option value="branch">영업점</option>
            <option value="hq">본부</option>
            <option value="it">IT</option>
          </select>
        </div>
        <div class="row mt">
          <button class="btn primary" type="submit">로그인 / 사용자 등록</button>
          <button id="logoutBtn" class="btn" type="button">세션 로그아웃</button>
        </div>
      </form>
    </section>

    <section class="card mt">
      <h2 style="margin:0 0 8px; font-size:18px;">저장된 사용자 빠른 로그인</h2>
      <div id="savedUsers" class="row"></div>
    </section>
  </main>

  <script src="/assets/common.js"></script>
  <script src="/assets/login.js"></script>
</body>
</html>
