services:
  - type: web
    name: knock-helpdesk-demo
    runtime: node
    region: singapore
    plan: free
    buildCommand: ""
    startCommand: "node server.js"
    envVars:
      - key: NODE_VERSION
        value: 22.22.0
      - key: PORT
        value: 10000
      - key: DATA_DIR
        value: /tmp/app-data
      - key: GEMINI_MODEL
        value: gemini-1.5-flash
