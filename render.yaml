services:
  - type: web
    name: knock-helpdesk-demo
    runtime: node
    region: singapore
    plan: starter
    # main 푸시마다 자동 배포(Blueprint/서비스에 동기화될 때 적용)
    branch: main
    autoDeployTrigger: commit
    buildCommand: ""
    startCommand: "node server.js"
    envVars:
      - key: NODE_VERSION
        value: 22.22.0
      - key: PORT
        value: 10000
      - key: DATA_DIR
        value: /var/data
      - key: GEMINI_MODEL
        value: gemini-1.5-flash
    disk:
      name: app-data
      mountPath: /var/data
      sizeGB: 1
